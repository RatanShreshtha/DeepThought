{% extends "base.html" %}

{% block content %}
<section class="section">
  <div class="container">
    <div class="has-text-centered">
      <h1 class="title is-2">{{ section.title }}</h1>
      <p class="subtitle is-4">{{ section.description }}</p>
      {% if config.extra.author.avatar %}
        {% include 'author_avatar.html' %}
      {% endif %}
      {{<dt.social_links social_config={config.extra.social} feed_url={get_url(path=config.feed_filenames[0]) if config.generate_feeds else ""} />}}
    </div>
    <div class="content">
      {{ section.content | safe }}
    </div>
  </div>
</section>
{% endblock %}
